openapi: 3.0.3

info:
  title: CAB System - Payment API
  description: API tính cước và thanh toán
  version: 1.0.0

paths:

  /trips/{tripId}/fare:
    get:
      summary: FR13 - Tính cước
      description: |
        FR13 - Tính cước

        AC09 - Sau khi chuyến hoàn thành, hệ thống
        xác định được số tiền khách hàng phải trả
        theo chính sách doanh nghiệp.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tính cước thành công
        '404':
          description: Không tìm thấy chuyến

  /payments:
    post:
      summary: FR14 - Thanh toán
      description: |
        FR14 - Thanh toán

        AC10 - Khách hàng có thể thanh toán bằng tiền mặt
        hoặc phương thức điện tử được hỗ trợ.
      responses:
        '200':
          description: Thanh toán thành công
        '400':
          description: Thông tin thanh toán không hợp lệ

  /payments/{paymentId}/retry:
    post:
      summary: FR15 - Xử lý thanh toán thất bại
      description: |
        FR15 - Xử lý thanh toán thất bại

        AC11 - Khi thanh toán điện tử thất bại,
        hệ thống thông báo kết quả và cho phép xử lý lại
        theo chính sách doanh nghiệp.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thực hiện thanh toán lại
        '400':
          description: Không thể xử lý thanh toán lại
